name: SonarCloud Analysis

on:
  pull_request:
  push:
    branches:
      - main
      - release-**

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: "sonarcloud-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/ci-setup

      - name: Install cargo-llvm-cov and cargo-nextest
        run: cargo install cargo-llvm-cov --locked && cargo install cargo-nextest --locked

      - name: Run unit tests with coverage
        run: |
          mkdir -p target/sonar
          cargo llvm-cov nextest \
            --ignore-filename-regex '/test_helpers\.rs' \
            --lcov --output-path target/sonar/lcov.info

      - name: Run Clippy and generate report
        run: |
          cargo clippy --tests --no-deps --all-features --message-format=json \
            -- -Dclippy::all -Dclippy::pedantic \
            > target/sonar/clippy.json 2>/dev/null || true

      # Secrets are withheld from pull_request runs opened by Dependabot or from forks,
      # so the scan itself can't happen here. Persist the reports + PR metadata as an
      # artifact and let the trusted sonarcloud-pr-scan.yml (workflow_run) do the upload.
      - name: Save PR metadata
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n \
            --arg number "$PR_NUMBER" \
            --arg headSha "$PR_HEAD_SHA" \
            --arg headRef "$PR_HEAD_REF" \
            --arg baseRef "$PR_BASE_REF" \
            '{number: $number, headSha: $headSha, headRef: $headRef, baseRef: $baseRef}' \
            > target/sonar/pr.json

      - name: Upload analysis reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-reports
          path: target/sonar
          retention-days: 1

      - name: SonarCloud Scan
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
